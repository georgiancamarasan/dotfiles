---
- name: Check whether rustup is installed
  ansible.builtin.stat:
    path: "{{ rust_cargo_home }}/bin/rustup"
  register: rust_rustup

- name: Install rustup
  when: not rust_rustup.stat.exists
  block:
    - name: Download rustup installer
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup-init.sh
        mode: "0755"

    # --no-modify-path: PATH is managed by your shell config, not by rustup.
    - name: Run rustup installer
      ansible.builtin.command:
        argv: [sh, /tmp/rustup-init.sh, -y, --no-modify-path, --default-toolchain, "{{ rust_toolchain }}"]
        creates: "{{ rust_cargo_home }}/bin/rustup"

- name: Install cargo packages
  community.general.cargo:
    name: "{{ cargo_packages + cargo_packages_extra }}"
    locked: true
    state: present
  environment:
    PATH: "{{ rust_cargo_home }}/bin:{{ ansible_facts.env.PATH }}"
  when:
    - (cargo_packages + cargo_packages_extra) | length > 0
    - rust_rustup.stat.exists or not ansible_check_mode
