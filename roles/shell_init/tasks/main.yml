---
- name: Write the shared shell init file
  ansible.builtin.template:
    src: shell_init.j2
    dest: "{{ shell_init_file }}"
    mode: "0644"

- name: Source the init file from bash and zsh
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE shell_init"
    block: '[ -f "{{ shell_init_file }}" ] && . "{{ shell_init_file }}"'
  loop: "{{ shell_init_rc_files }}"
