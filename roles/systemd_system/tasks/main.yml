---
- name: Install system unit files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ item.name }}"
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ systemd_system_units }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable and start systemd system units
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    scope: system
    daemon_reload: true
    enabled: "{{ item.enabled | default(true) }}"
    state: "{{ item.state | default('started') }}"
  become: true
  loop: "{{ systemd_system_units }}"
  loop_control:
    label: "{{ item.name }}"
