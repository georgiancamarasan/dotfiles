---
- name: Write the shared environment file
  ansible.builtin.template:
    src: shell_env.j2
    dest: "{{ shell_env_file }}"
    mode: "0644"

- name: Source the environment file from bash and zsh
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE shell_env"
    block: '[ -f "{{ shell_env_file }}" ] && . "{{ shell_env_file }}"'
  loop: "{{ shell_env_rc_files }}"
