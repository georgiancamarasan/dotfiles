---
# No force: a real file or directory already at dest makes the run fail
# instead of being replaced.
- name: Create symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest if item.dest.startswith('/') else ansible_facts.env.HOME + '/' + item.dest }}"
    state: link
  loop: "{{ links + links_extra }}"
  loop_control:
    label: "{{ item.dest }}"
