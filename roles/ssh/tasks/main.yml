---
- name: Check which key files are present in the repo
  ansible.builtin.set_fact:
    ssh_private_key_src: "{{ role_path }}/files/{{ ssh_key_name }}"
    ssh_private_key_present: "{{ (role_path + '/files/' + ssh_key_name) is file }}"
    ssh_public_key_present: "{{ (role_path + '/files/' + ssh_key_name + '.pub') is file }}"

- name: Report missing key files
  ansible.builtin.debug:
    msg: >-
      No SSH key found in roles/ssh/files/ ({{ ssh_key_name }} / {{ ssh_key_name }}.pub).
      Skipping. See roles/ssh/files/README.md.
  when: not ssh_private_key_present or not ssh_public_key_present

- name: Refuse to use an unencrypted private key
  ansible.builtin.assert:
    that: lookup('ansible.builtin.pipe', 'head -n1 ' + ssh_private_key_src | quote) is match('^[$]ANSIBLE_VAULT')
    fail_msg: >-
      {{ ssh_private_key_src }} is NOT vault-encrypted. Run
      `ansible-vault encrypt {{ ssh_private_key_src }}` before running the playbook
      (and never commit it unencrypted).
    quiet: true
  when: ssh_private_key_present

- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: "0700"

- name: Install SSH key pair
  when:
    - ssh_install_private_key | bool
    - ssh_private_key_present
    - ssh_public_key_present
  block:
    - name: Check whether the private key is already installed
      ansible.builtin.stat:
        path: "{{ ssh_dir }}/{{ ssh_key_name }}"
      register: ssh_installed_key

    # Decrypting needs the vault password, so only do it when the key is
    # missing or an update is requested (-e ssh_update_private_key=true).
    - name: Install private key (decrypted from vault)
      ansible.builtin.copy:
        src: "{{ ssh_key_name }}"
        dest: "{{ ssh_dir }}/{{ ssh_key_name }}"
        mode: "0600"
      no_log: true
      when: not ssh_installed_key.stat.exists or ssh_update_private_key | bool

    - name: Install public key
      ansible.builtin.copy:
        src: "{{ ssh_key_name }}.pub"
        dest: "{{ ssh_dir }}/{{ ssh_key_name }}.pub"
        mode: "0644"

- name: Authorize public key for login
  ansible.posix.authorized_key:
    user: "{{ ansible_facts.user_id }}"
    key: "{{ lookup('ansible.builtin.file', ssh_key_name + '.pub') }}"
    state: present
  when:
    - ssh_authorize_public_key | bool
    - ssh_public_key_present
