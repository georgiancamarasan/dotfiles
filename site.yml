---
# Main entry point. Run everything:   make desktop
# Only some roles:                    make desktop TAGS=nodejs,rust
- name: Base setup (desktop and servers)
  hosts: all
  become: false
  roles:
    - { role: system_packages, tags: [system_packages, packages] }
    - { role: dotfiles, tags: [dotfiles, stow] }
    - { role: rust, tags: [rust], when: install_rust | bool }
    - { role: nodejs, tags: [nodejs], when: install_nodejs | bool }
    - { role: python_tools, tags: [python_tools], when: install_python_tools | bool }
    - { role: neovim, tags: [neovim], when: install_neovim | bool }
    - { role: ssh, tags: [ssh] }

- name: Desktop only
  hosts: desktop
  become: false
  roles:
    - { role: aur, tags: [aur, packages], when: ansible_facts.os_family == 'Archlinux' }
    - { role: systemd_user, tags: [systemd_user, systemd] }
