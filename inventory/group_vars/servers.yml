---
# Ubuntu servers: a lighter setup.

install_rust: false
install_nodejs: true   # needed if your neovim config relies on node-based tools
install_python_tools: true
install_neovim: true

stow_packages:
  - name: nvim
  - name: tmux

# Don't copy your private key to servers; authorize your public key instead.
ssh_install_private_key: false
ssh_authorize_public_key: true
