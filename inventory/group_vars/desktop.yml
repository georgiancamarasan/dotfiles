---
# Desktop (Ubuntu) specific settings.

# Kubernetes minor version for the pkgs.k8s.io repo. The repo only carries
# patch releases of this minor, so bump it by hand to upgrade kubectl.
kubernetes_minor: v1.37

# Third-party apt repositories, added before packages are installed.
apt_repositories:
  - name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  - name: kubernetes
    uris: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/
    suites: /
    signed_by: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key
  - name: helm
    uris: https://packages.buildkite.com/helm-linux/helm-debian/any/
    suites: any
    components: main
    signed_by: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey

# Added on top of packages in all/main.yml.
packages_extra:
  - dotnet-sdk-10.0 # pulls in the .NET and ASP.NET Core runtimes
  - golang-go
  - lazygit
  # From the apt_repositories above.
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - kubectl
  - helm

# Tools without an apt package, downloaded from upstream releases into
# ~/.local/bin. Bump version to upgrade.
release_binaries:
  - name: tea # Gitea CLI
    version: 0.16.0
    url: https://dl.gitea.com/tea/{version}/tea-{version}-linux-amd64
  - name: crane # container registry tool (go-containerregistry)
    version: v0.22.1
    url: https://github.com/google/go-containerregistry/releases/download/{version}/go-containerregistry_Linux_x86_64.tar.gz
    member: crane

# Nerd Fonts (icons for starship and neovim) and the Ptyxis terminal font.
nerd_fonts:
  - DejaVuSansMono
terminal_font: DejaVuSansM Nerd Font Mono 11

# Added on top of stow_packages in all/main.yml.
stow_packages_extra:
  - name: systemd
    no_folding: true
  - name: tui-journal # config points at the DB on the NFS share

# Mountpoints for the NFS mount units below (systemd does not create them).
mnt_dirs:
  - nfs
  - Pictures
  - Videos

# Symlinks added on top of links in all/main.yml (the NFS share only exists here).
# Taskwarrior config and data live on the NFS.
links_extra:
  - { src: /mnt/nfs/task/.taskrc, dest: .taskrc }
  - { src: /mnt/nfs/data/.task, dest: .task }

# systemd system units (unit files live in the repo-root files/ dir).
systemd_system_units:
  - name: mnt-nfs.mount
    state: started # started | stopped (default: started)
    enabled: true
  - name: mnt-Pictures.mount
    state: started # started | stopped (default: started)
    enabled: true
  - name: mnt-Videos.mount
    state: started # started | stopped (default: started)
    enabled: true

# systemd --user units (files live in stow/systemd/.config/systemd/user/).
systemd_user_units: []
  # - name: my-sync.timer
  #   state: started      # started | stopped (default: started)
  #   enabled: true

# Install the vault-encrypted private key from roles/ssh/files/.
ssh_install_private_key: true
