---
# Desktop (Manjaro) specific settings.

packages_arch:
  - base-devel
  - fd
  - bat
  # desktop apps
  # - firefox
  # - kitty

# AUR packages, installed with paru.
aur_packages: []
  # - visual-studio-code-bin

stow_packages:
  - name: nvim
  - name: tmux
  - name: systemd
    no_folding: true

# systemd --user units (files live in stow/systemd/.config/systemd/user/).
systemd_user_units: []
  # - name: my-sync.timer
  #   state: started      # started | stopped (default: started)
  #   enabled: true

# Install the vault-encrypted private key from roles/ssh/files/.
ssh_install_private_key: true
