---
# Desktop (Manjaro) specific settings.

# Added on top of packages_arch in all/main.yml.
packages_arch_extra: []
  # desktop apps
  # - firefox
  # - kitty

# AUR packages, installed with paru.
aur_packages: []
  # - visual-studio-code-bin

# Added on top of stow_packages in all/main.yml.
stow_packages_extra:
  - name: systemd
    no_folding: true

# Mountpoints for the NFS mount units below (systemd does not create them).
mnt_dirs:
  - nfs
  - Pictures
  - Videos

# Symlinks added on top of links in all/main.yml (the NFS share only exists here).
# Taskwarrior config and data live on the NFS.
links_extra:
  - { src: /mnt/nfs/task/.taskrc, dest: .taskrc }
  - { src: /mnt/nfs/data/.task, dest: .task }

# systemd system units (unit files live in the repo-root files/ dir).
systemd_system_units:
  - name: mnt-nfs.mount
    state: started      # started | stopped (default: started)
    enabled: true
  - name: mnt-Pictures.mount
    state: started      # started | stopped (default: started)
    enabled: true
  - name: mnt-Videos.mount
    state: started      # started | stopped (default: started)
    enabled: true

# systemd --user units (files live in stow/systemd/.config/systemd/user/).
systemd_user_units: []
  # - name: my-sync.timer
  #   state: started      # started | stopped (default: started)
  #   enabled: true

# Install the vault-encrypted private key from roles/ssh/files/.
ssh_install_private_key: true
