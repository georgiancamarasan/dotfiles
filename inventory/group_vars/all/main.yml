---
# ---------------------------------------------------------------------------
# Settings shared by every machine. Group files (desktop.yml / servers.yml)
# override scalar settings defined here. A group list *replaces* the shared
# list, so for lists put shared items here and per-group additions in the
# matching `<name>_extra` variable (e.g. stow_packages_extra) in the group file.
# ---------------------------------------------------------------------------

# Where the repo lives on the target. For local runs it is this checkout;
# for SSH runs the stow/ tree is copied to ~/.dotfiles on the server.
dotfiles_dir: "{{ playbook_dir if ansible_connection | default('ssh') == 'local' else ansible_facts.env.HOME + '/.dotfiles' }}"

# Upgrade all system packages on every run (pacman -Syu / apt dist-upgrade).
system_upgrade: true

# Feature toggles – turn whole roles on/off per group.
install_rust: true
install_nodejs: true
install_python_tools: true
install_neovim: true
# ---------------------------------------------------------------------------
# Shell aliases (bash and zsh) and /mnt directories
# ---------------------------------------------------------------------------
shell_aliases:
  ll: eza -lah
  gs: git status

# Directories prepended to PATH (bash and zsh). $HOME is expanded by the shell.
shell_path:
  - $HOME/.local/bin
  - $HOME/.cargo/bin
  - $HOME/.local/share/fnm

# Lines run at shell start, after PATH is set. $SHELL_NAME is "bash" or "zsh".
shell_init:
  - eval "$(starship init $SHELL_NAME)"
  - eval "$(zoxide init $SHELL_NAME)"
  - eval "$(fnm env --use-on-cd --shell $SHELL_NAME)"

# Names (or {name, mode, owner}) of directories to create under /mnt.
mnt_dirs: []

# ---------------------------------------------------------------------------
# Native packages
# ---------------------------------------------------------------------------
# Same package name on Manjaro and Ubuntu.
packages_common:
  - git
  - curl
  - wget
  - unzip
  - stow
  - tmux
  - ripgrep
  - fzf
  - jq
  - htop
  - zsh
  - neovim
  - gettext
  - less
  - mypy
  - nodejs
  - npm
  - progress
  - starship
  - tidy
  - tree
  - tree-sitter-cli
  - yamllint
  - zoxide

# Manjaro / Arch only.
packages_arch:
  - base-devel
  - fd
  - bat
  - nfs-utils
  - bind
  - ntfs-3g

# Ubuntu / Debian only.
packages_debian:
  - build-essential
  - fd-find
  - bat
  - rsync
  - nfs-common
  - uuid-dev
  - bind9

# ---------------------------------------------------------------------------
# Stow packages: folder names under stow/. no_folding keeps target dirs real
# directories (needed for systemd, where systemctl writes its own symlinks).
# ---------------------------------------------------------------------------
stow_packages:
  - name: nvim
  - name: tmux
  - name: starship
