---
# Language-level tools, installed per user (no sudo).

# npm global packages (installed with fnm's default Node LTS).
npm_packages:
  - neovim # node provider for neovim
  - eslint
  - prettier
  - ts-node
  - typescript
  - typescript-language-server

# Rust CLI tools, installed with `cargo install --locked`.
cargo_packages:
  - bat
  - bottom
  - carl
  - diskonaut
  - fd-find
  - just
  - eza
  - git-delta
  - pueue
  - ripgrep
  - rm-improved
  - stylua
  - tre-command
  - watchexec-cli
  - tui-journal

# Python applications, installed with `uv tool install` into isolated venvs.
uv_tools:
  - tldr
  - ruff
  - httpie
  - ansible-lint
