---
# Language-level tools, installed per user (no sudo).

# npm global packages (installed with fnm's default Node LTS).
npm_packages:
  - neovim # node provider for neovim
  - eslint
  - prettier
  - ts-node
  - typescript
  - typescript-language-server

# Rust CLI tools, installed with `cargo install --locked`. Tools Ubuntu packages
# (bat, fd, ripgrep, eza) come from apt instead (`packages` in main.yml).
cargo_packages:
  - bottom
  - carl
  - diskonaut
  - just
  - git-delta
  - pueue
  - rm-improved
  - stylua
  - tre-command
  - watchexec-cli
  - tui-journal

# Python applications, installed with `uv tool install` into isolated venvs.
uv_tools:
  - ansible-lint
  - dunk
  - harlequin[postgres]
  - httpie
  - ruff
  - tldr
