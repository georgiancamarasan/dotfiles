# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10        # snappy <Esc> in neovim
set -g focus-events on        # neovim autoread
setw -g mode-keys vi

# Splits / new windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl-h/j/k/l (no prefix) move between tmux panes and neovim splits; pairs with
# vim-tmux-navigator (nvim/lua/plugins/tmux-navigator.lua). Keys are passed through
# to the program when it is vim/neovim/fzf.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# Ctrl-l is taken above, so clear the screen with <prefix> Ctrl-l
bind C-l send-keys C-l

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
